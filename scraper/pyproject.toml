[project]
name = "scraper"
version = "0.1.0"
description = "Background worker for scraping products from different markets."
readme = "../README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-grpc>=0.62b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.30.0",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88

target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors (standard formatting/syntax errors)
    "F",  # pyflakes (unused variables, undefined names - catches real bugs!)
    "I",  # isort (automatically sorts and groups your imports alphabetically)
    "UP", # pyupgrade (automatically upgrades older Python syntax to modern 3.14 syntax)
    "B",  # flake8-bugbear (likely bugs and footguns)
    "ASYNC", # flake8-async (async-specific correctness checks)
    "SIM", # flake8-simplify (simpler equivalent code)
    "PLC", # pylint convention checks
    "PLE", # pylint error checks
    "PLW", # pylint warning checks
    "RUF", # Ruff-specific rules
]

ignore = [
    "ASYNC109", # driver methods pass timeout values through to Playwright APIs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call external services or real retailer websites",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
