  - name: CreateSessionEndpoint
  - name: CreateTokenEndpoint
  - name: GetMarketsEndpoint
  - name: GetProductsEndpoint
  - name: SnapshotEndpoint
  - name: GetShoppingListsEndpoint
  - name: CreateShoppingListEndpoint
  - name: GetShoppingListEndpoint
  - name: RenameShoppingListEndpoint
  - name: AddShoppingItemsEndpoint
  - name: UpdateShoppingItemEndpoint
  - name: RemoveShoppingItemEndpoint
  - name: CheckoutShoppingListEndpoint