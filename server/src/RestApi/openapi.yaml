openapi: '3.1.1'
info:
  title: Metaspesa REST API
  description: Errors use ProblemDetails with a stable code and traceId for support.
  version: 1.0.0
servers:
  - url: /
paths:
  /api/v1/auth/registrations:
    post:
      tags:
        - RegisterEndpoint
      summary: Register a shopper.
      description: Create a shopper account. Requests must come from an allowed browser origin.
      operationId: RegisterShopper
      requestBody:
        description: Credentials supplied when registering or authenticating a shopper.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      responses:
        '201':
          description: Account created; no response body.
        '400':
          description: 'Username or password violates registration rules, or the body is invalid.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The username is already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The browser Origin header is missing or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/sessions:
    post:
      tags:
        - CreateSessionEndpoint
      summary: Create a browser session.
      description: Authenticate a shopper and set an HTTP-only session cookie. Requests must come from an allowed browser origin.
      operationId: CreateBrowserSession
      requestBody:
        description: Credentials supplied when registering or authenticating a shopper.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      responses:
        '204':
          description: Authenticated. A session cookie is set; no response body.
        '400':
          description: The request body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The username or password is incorrect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The browser Origin header is missing or not allowed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/tokens:
    post:
      tags:
        - CreateTokenEndpoint
      summary: Create a machine token.
      description: Authenticate credentials and return a bearer token for non-browser clients.
      operationId: CreateMachineToken
      requestBody:
        description: Credentials supplied when registering or authenticating a shopper.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
        required: true
      responses:
        '200':
          description: Authenticated. Returns a bearer token and its expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: The request body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The username or password is incorrect.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/markets:
    get:
      tags:
        - GetMarketsEndpoint
      summary: List registered markets.
      description: Return markets available for catalog filtering and product display.
      operationId: GetMarkets
      responses:
        '200':
          description: Available markets and their stable IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketListResponse'
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/markets/{marketName}/snapshots/{date}':
    post:
      tags:
        - SnapshotEndpoint
      summary: Import a market price snapshot.
      description: Import product observations for a market and date. Requires authentication with the ProductManager role.
      operationId: AddMarketSnapshot
      parameters:
        - name: marketName
          in: path
          description: Name of the observed market.
          required: true
          schema:
            type: string
        - name: date
          in: path
          description: 'Observation date in YYYY-MM-DD format, on or after 2023-01-01.'
          required: true
          schema:
            type: string
      requestBody:
        description: Batch of market product observations.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotRequest'
        required: true
      responses:
        '204':
          description: Snapshot imported; no response body.
        '400':
          description: The date or a product observation is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the ProductManager role.
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/shopping-lists:
    get:
      tags:
        - GetShoppingListsEndpoint
      summary: List the shopper's shopping lists.
      description: Return named and temporary lists owned by the authenticated shopper. Requires the Shopper role.
      operationId: GetShoppingLists
      responses:
        '200':
          description: Shopping list summaries; the collection can be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListCollectionResponse'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the Shopper role.
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
        - CreateShoppingListEndpoint
      summary: Create a shopping list.
      description: Supply a name for a named list or null for a temporary list. Requires the Shopper role.
      operationId: CreateShoppingList
      requestBody:
        description: Details for a new named or temporary shopping list.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoppingListRequest'
        required: true
      responses:
        '201':
          description: List created; the response contains its ID and the Location header identifies it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
        '400':
          description: The list name is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: A list with this name or a temporary list already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the Shopper role.
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/shopping-lists/{listId}':
    get:
      tags:
        - GetShoppingListEndpoint
      summary: Get a shopping list.
      description: Return the list and its items with current product details for its owner. Requires the Shopper role.
      operationId: GetShoppingList
      parameters:
        - name: listId
          in: path
          description: ID of the shopping list to retrieve.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The shopping list and its items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListResponse'
        '400':
          description: The list ID is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the Shopper role.
        '404':
          description: The list or a referenced product format was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
        - RenameShoppingListEndpoint
      summary: Rename a shopping list.
      description: 'Assign a non-blank name to an owned list, including a temporary list. Requires the Shopper role.'
      operationId: RenameShoppingList
      parameters:
        - name: listId
          in: path
          description: ID of the shopping list to rename.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: New name for a shopping list.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameShoppingListRequest'
        required: true
      responses:
        '204':
          description: List renamed; no response body.
        '400':
          description: The list ID or new name is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The list was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Another list already has this name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the Shopper role.
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/shopping-lists/{listId}/items':
    post:
      tags:
        - AddShoppingItemsEndpoint
      summary: Add items to a shopping list.
      description: Add one or more product formats to an owned list. Each format may appear only once in the list. Requires the Shopper role.
      operationId: AddShoppingItems
      parameters:
        - name: listId
          in: path
          description: ID of the shopping list to update.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Items to add to a shopping list.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddShoppingItemsRequest'
        required: true
      responses:
        '204':
          description: Items added; no response body.
        '400':
          description: 'The list ID or items are invalid, or the collection is empty.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The list or a product format was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: A product format is already in the list or repeated in the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the Shopper role.
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/shopping-lists/{listId}/items/{shoppingItemId}':
    patch:
      tags:
        - UpdateShoppingItemEndpoint
      summary: Update a shopping item.
      description: 'Change the amount, checked state, or both for an item in an owned list. Requires the Shopper role.'
      operationId: UpdateShoppingItem
      parameters:
        - name: listId
          in: path
          description: ID of the shopping list containing the item.
          required: true
          schema:
            type: string
            format: uuid
        - name: shoppingItemId
          in: path
          description: ID of the shopping item.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Changes to a shopping item; at least one field is required.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShoppingItemRequest'
        required: true
      responses:
        '204':
          description: Item updated; no response body.
        '400':
          description: 'An ID or amount is invalid, or neither field was supplied.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the Shopper role.
        '404':
          description: The list or item was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - RemoveShoppingItemEndpoint
      summary: Remove a shopping item.
      description: Remove an item from an owned shopping list. Requires the Shopper role.
      operationId: RemoveShoppingItem
      parameters:
        - name: listId
          in: path
          description: ID of the shopping list containing the item.
          required: true
          schema:
            type: string
            format: uuid
        - name: shoppingItemId
          in: path
          description: ID of the shopping item.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Item removed; no response body.
        '400':
          description: The list or shopping item ID is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the Shopper role.
        '404':
          description: The list or item was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/shopping-lists/{listId}/checkouts':
    post:
      tags:
        - CheckoutShoppingListEndpoint
      summary: Check out a shopping list.
      description: Commit the checkout of checked items. Purchase creation is processed separately. Requires the Shopper role.
      operationId: CheckoutShoppingList
      parameters:
        - name: listId
          in: path
          description: ID of the shopping list to check out.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Checkout accepted; the response contains its checkout ID. This does not confirm that a purchase exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: The list ID is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No valid authentication token was provided.
        '403':
          description: The authenticated user lacks the Shopper role.
        '404':
          description: The list was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: No active items are checked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: An unexpected server or database failure occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AddShoppingItemsRequest:
      required:
        - items
      type: object
      properties:
        items:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/ShoppingItemRequest'
          description: Non-empty array of items with distinct product format IDs.
      description: Items to add to a shopping list.
    CheckoutResponse:
      required:
        - checkoutId
      type: object
      properties:
        checkoutId:
          type: string
          description: Stable checkout occurrence ID.
          format: uuid
      description: Identifier of an accepted checkout.
    CreateShoppingListRequest:
      required:
        - name
      type: object
      properties:
        name:
          type:
            - 'null'
            - string
          description: 'List name, or null to create a temporary list.'
      description: Details for a new named or temporary shopping list.
    CredentialsRequest:
      required:
        - username
        - password
      type: object
      properties:
        username:
          type: string
          description: Shopper username used to identify the account.
        password:
          type: string
          description: Plaintext password for this request; never returned in responses.
      description: Credentials supplied when registering or authenticating a shopper.
    FormatResponse:
      required:
        - id
        - quantity
        - currentPrice
        - observedAt
      type: object
      properties:
        id:
          type: string
          description: Stable format ID used as the shopping-list item reference.
          format: uuid
        quantity:
          description: Amount and unit sold in this format.
          $ref: '#/components/schemas/QuantityResponse'
        currentPrice:
          description: Latest observed price for this format.
          $ref: '#/components/schemas/MoneyResponse'
        observedAt:
          type: string
          description: UTC instant of the latest price observation.
          format: date-time
        imageUrl:
          type:
            - 'null'
            - string
          description: Absolute product image URL when available; otherwise omitted.
      description: Purchasable product format with its latest price observation.
    GetProductsRequest:
      type: object
      properties:
        query:
          type:
            - 'null'
            - string
          description: Case-insensitive product-name fragment. Omit to include all names.
        marketId:
          type:
            - 'null'
            - array
          items:
            type: string
            format: uuid
          description: Include products from several markets. IDs must be UUIDs.
        brand:
          type:
            - 'null'
            - string
          description: Case-insensitive brand-name fragment. Omit to include all brands.
        page:
          type:
            - 'null'
            - integer
          description: One-based page number; defaults to 1.
          format: int32
        pageSize:
          type:
            - 'null'
            - integer
          description: 'Maximum products per page, from 1 to 100; defaults to 24.'
          format: int32
        sort:
          type:
            - 'null'
            - string
          description: Sort by name or lowest latest format price. Defaults to name.
      description: Product catalog query filters.
    IdResponse:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          description: Stable shopping list ID.
          format: uuid
      description: Identifier of a newly created shopping list.
    MarketListResponse:
      required:
        - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketResponse'
          description: Market summaries; empty when no markets are registered.
      description: Markets available in the catalog.
    MarketResponse:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
          description: Stable market ID used by the catalog marketId filter.
          format: uuid
        name:
          type: string
          description: Display name of the market.
        logoUrl:
          type:
            - 'null'
            - string
          description: Absolute logo URL when available; otherwise omitted.
      description: Market identity and display information.
    MoneyResponse:
      required:
        - amount
        - currency
      type: object
      properties:
        amount:
          type: number
          description: Price in the stated currency.
          format: double
        currency:
          type: string
          description: 'Currency code of the price, such as EUR.'
      description: Monetary amount and currency.
    ProblemDetails:
      required:
        - code
        - traceId
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
          description: URI identifying the class of problem.
        title:
          type:
            - 'null'
            - string
          description: Short human-readable reason for the failure.
        status:
          type:
            - 'null'
            - integer
          description: HTTP status code of this response.
          format: int32
        detail:
          type:
            - 'null'
            - string
          description: Additional detail when available.
        instance:
          type:
            - 'null'
            - string
          description: Request URI when available.
        code:
          type: string
          description: Stable machine-readable error code.
        traceId:
          type: string
          description: Request trace identifier for support and logs.
      description: Error response with a machine-readable code and request trace identifier.
    ProductPageResponse:
      required:
        - items
        - page
        - pageSize
        - totalItems
        - totalPages
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
          description: Products in this page; empty when none match.
        page:
          type: integer
          description: One-based page number requested.
          format: int32
        pageSize:
          type: integer
          description: Maximum number of products requested for this page.
          format: int32
        totalItems:
          type: integer
          description: Number of matching products across all pages.
          format: int32
        totalPages:
          type: integer
          description: Number of pages at this page size; zero when none match.
          format: int32
      description: One page of matching products.
    ProductResponse:
      required:
        - id
        - name
        - brand
        - market
        - formats
      type: object
      properties:
        id:
          type: string
          description: Stable ID of this product.
          format: uuid
        name:
          type: string
          description: Product display name.
        brand:
          type: string
          description: Product brand display name.
        market:
          description: Market that owns this product.
          $ref: '#/components/schemas/MarketResponse'
        formats:
          type: array
          items:
            $ref: '#/components/schemas/FormatResponse'
          description: Available quantities and their latest observed prices.
      description: One market-owned product. IDs do not imply cross-market equivalence.
    QuantityResponse:
      required:
        - amount
        - unit
      type: object
      properties:
        amount:
          type: number
          description: Numeric quantity of the format.
          format: double
        unit:
          type: string
          description: 'Unit of measure, such as kg, g, or l.'
      description: Quantity associated with one product format.
    RenameShoppingListRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
          description: Required non-blank name for the list.
      description: New name for a shopping list.
    ShoppingItemRequest:
      required:
        - productFormatId
        - amount
        - checked
      type: object
      properties:
        productFormatId:
          type: string
          description: ID of an existing product format.
          format: uuid
        amount:
          type: integer
          description: Positive number of units to buy.
          format: int32
        checked:
          type: boolean
          description: Whether the item is marked for checkout.
      description: One product format to add to a shopping list.
    ShoppingItemResponse:
      required:
        - id
        - productName
        - brand
        - market
        - quantity
        - unitPrice
        - amount
        - checked
        - imageUrl
      type: object
      properties:
        id:
          type: string
          description: Stable ID used to update or remove this item.
          format: uuid
        productName:
          type: string
          description: Product display name.
        brand:
          type: string
          description: Product brand display name.
        market:
          description: Market that sells the product.
          $ref: '#/components/schemas/ShoppingMarketResponse'
        quantity:
          description: Quantity sold in one product format.
          $ref: '#/components/schemas/ShoppingQuantityResponse'
        unitPrice:
          description: Latest observed price for one product format.
          $ref: '#/components/schemas/ShoppingMoneyResponse'
        amount:
          type: integer
          description: Positive number of units on the list.
          format: int32
        checked:
          type: boolean
          description: Whether this item is marked for checkout.
        imageUrl:
          type:
            - 'null'
            - string
          description: Absolute product image URL when available; otherwise omitted.
      description: Shopping item with current product and price information.
    ShoppingListCollectionResponse:
      required:
        - items
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingListSummaryResponse'
          description: List summaries; empty when the shopper owns no lists.
      description: Shopping lists owned by the authenticated shopper.
    ShoppingListResponse:
      required:
        - id
        - name
        - isTemporary
        - items
      type: object
      properties:
        id:
          type: string
          description: Stable shopping list ID.
          format: uuid
        name:
          type:
            - 'null'
            - string
          description: 'List name, omitted for a temporary list.'
        isTemporary:
          type: boolean
          description: Whether this is an unnamed temporary list.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingItemResponse'
          description: Items in the list; empty when it has no items.
      description: Shopping list and its current items.
    ShoppingListSummaryResponse:
      required:
        - id
        - name
        - isTemporary
      type: object
      properties:
        id:
          type: string
          description: Stable shopping list ID.
          format: uuid
        name:
          type:
            - 'null'
            - string
          description: 'List name, omitted for a temporary list.'
        isTemporary:
          type: boolean
          description: Whether this is the shopper's unnamed temporary list.
      description: Shopping list identity and display information.
    ShoppingMarketResponse:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: string
          description: Stable market ID.
          format: uuid
        name:
          type: string
          description: Market display name.
      description: Market that sells a shopping item.
    ShoppingMoneyResponse:
      required:
        - amount
        - currency
      type: object
      properties:
        amount:
          type: number
          description: Price in the stated currency.
          format: double
        currency:
          type: string
          description: 'Currency code of the price, such as EUR.'
      description: Latest observed price for one product format.
    ShoppingQuantityResponse:
      required:
        - amount
        - unit
      type: object
      properties:
        amount:
          type: number
          description: Numeric quantity of the format.
          format: double
        unit:
          type: string
          description: 'Unit of measure, such as kg, g, or l.'
      description: Quantity sold in one product format.
    SnapshotItem:
      required:
        - name
        - price
        - quantity
        - unitOfMeasure
        - brandName
        - imageUrl
      type: object
      properties:
        name:
          type:
            - 'null'
            - string
          description: Required nonblank product name.
        price:
          type: number
          description: Observed non-negative price amount.
          format: double
        quantity:
          type: number
          description: 'Positive amount; converted quantity must fit numeric(10,3) exactly.'
          format: double
        unitOfMeasure:
          type:
            - 'null'
            - string
          description: 'Supported unit or alias, converted to g, ml, unit, wash, or dose.'
        brandName:
          type:
            - 'null'
            - string
          description: Required nonblank brand name.
        imageUrl:
          type:
            - 'null'
            - string
          description: Optional absolute product image URL.
      description: One observed product format in a market snapshot.
    SnapshotRequest:
      required:
        - items
      type: object
      properties:
        items:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/SnapshotItem'
          description: Non-empty array of valid product observations.
      description: Batch of market product observations.
    TokenResponse:
      required:
        - accessToken
        - tokenType
        - expiresAt
      type: object
      properties:
        accessToken:
          type: string
          description: JWT sent in the Authorization Bearer header.
        tokenType:
          type: string
          description: Authorization scheme; always Bearer.
        expiresAt:
          type: string
          description: UTC instant after which the token is invalid.
          format: date-time
      description: Bearer token issued after successful machine authentication.
    UpdateShoppingItemRequest:
      required:
        - amount
        - checked
      type: object
      properties:
        amount:
          type:
            - 'null'
            - integer
          description: 'New positive amount, or null to keep the current amount.'
          format: int32
        checked:
          type:
            - 'null'
            - boolean
          description: 'New checked state, or null to keep the current state.'
      description: Changes to a shopping item; at least one field is required.
tags:
