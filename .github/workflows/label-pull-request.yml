name: Label pull request

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "component/client" --repo "$GITHUB_REPOSITORY" --color "01f0b2" --force
          gh label create "component/scraper" --repo "$GITHUB_REPOSITORY" --color "ab6358" --force
          gh label create "component/server" --repo "$GITHUB_REPOSITORY" --color "5582f2" --force
          gh label create "component/db" --repo "$GITHUB_REPOSITORY" --color "dcfe01" --force
          gh label create "context/markets" --repo "$GITHUB_REPOSITORY" --color "f13d36" --force
          gh label create "context/shopping" --repo "$GITHUB_REPOSITORY" --color "c9bb70" --force

      - name: Apply labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
