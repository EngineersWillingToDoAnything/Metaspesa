name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.100"
  NODE_VERSION: "26.9.0"
  PYTHON_VERSION: "3.14"

jobs:
  telemetry-validation:
    name: Metaspesa telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate application Compose models
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f telemetry/compose.yaml config --quiet

      - name: Validate Metaspesa recording rules
        run: docker run --rm --entrypoint /bin/promtool --volume "${GITHUB_WORKSPACE}/telemetry/mimir/rules:/rules:ro" prom/prometheus:v3.15.0 check rules /rules/anonymous/metaspesa.yaml

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/Directory.Packages.props', 'server/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Check formatting
        run: dotnet format server/Metaspesa.slnx --verify-no-changes --verbosity diagnostic

      - name: Restore server dependencies
        run: dotnet restore server/Metaspesa.slnx

      - name: Test server
        run: dotnet test --solution server/Metaspesa.slnx --no-restore

  client-quality:
    name: Client quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Generate open API type
        run: pnpm run generate-api
        working-directory: client

      - name: Check lint and formatting
        run: pnpm run lint
        working-directory: client

      - name: Check types
        run: pnpm run typecheck
        working-directory: client

      - name: Build production client
        run: pnpm run build
        working-directory: client

      - name: Test client
        run: pnpm run test
        working-directory: client

  scraper-quality:
    name: Scraper quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: scraper/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: scraper

      - name: Check lint
        run: uv run ruff check src test
        working-directory: scraper

      - name: Check formatting
        run: uv run ruff format --check src test
        working-directory: scraper

      - name: Check types with Pyright
        run: uv run pyright src test
        working-directory: scraper

      - name: Test scraper without live retailers
        run: uv run pytest -m "not integration"
        working-directory: scraper

  docker-build:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            dockerfile: ./server/src/RestApi/Dockerfile

          - name: migrations
            context: ./server
            dockerfile: ./server/src/MigrationService/Dockerfile

          - name: client
            context: ./client
            dockerfile: ./client/Dockerfile

          - name: scraper
            context: ./scraper
            dockerfile: ./scraper/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  client-server-integration:
    name: Client <-> server integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOCKER_NETWORK: metaspesa-ci
      POSTGRES_DB: metaspesa
      POSTGRES_USER: metaspesa
      POSTGRES_PASSWORD: metaspesa
      POSTGRES_CONNECTION_STRING: Host=db;Port=5432;Database=metaspesa;Username=metaspesa;Password=metaspesa
      JWT_KEY: integration-tests-only-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate-api

      - name: Start database
        run: |
          docker network create "$DOCKER_NETWORK"

          docker run \
            --detach \
            --name db \
            --network "$DOCKER_NETWORK" \
            --env POSTGRES_DB \
            --env POSTGRES_USER \
            --env POSTGRES_PASSWORD \
            postgres:18.6-alpine

          until docker exec db pg_isready \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB"
          do
            sleep 1
          done

      - name: Run migrations and seed integration fixtures
        run: |
          docker build \
            --file server/src/MigrationService/Dockerfile \
            --tag metaspesa-migrations-ci \
            server

          docker run \
            --rm \
            --network "$DOCKER_NETWORK" \
            --env POSTGRES_CONNECTION_STRING \
            --env SEED_PROFILE=integration \
            metaspesa-migrations-ci

      - name: Build API
        run: |
          docker build \
            --file server/src/RestApi/Dockerfile \
            --tag metaspesa-server-ci \
            server

      - name: Start APIs
        run: |
          docker run \
            --detach \
            --name server \
            --network "$DOCKER_NETWORK" \
            --publish "4001:8080" \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env ASPNETCORE_URLS=http://+:8080 \
            --env POSTGRES_CONNECTION_STRING \
            --env "Jwt__Key=$JWT_KEY" \
            metaspesa-server-ci

      - name: Wait for APIs
        shell: bash
        run: |
          for _ in {1..30}; do
            if (echo > "/dev/tcp/127.0.0.1/4001") 2>/dev/null; then
              exit 0
            fi

            if [[ "$(docker inspect -f '{{.State.Running}}' "server")" != "true" ]]; then
              docker logs "server"
              exit 1
            fi

            sleep 1
          done

          docker logs "server"
          exit 1

      - name: Run client integration tests
        working-directory: client
        env:
          REST_API_URL: http://localhost:4001/api/v1
        run: pnpm run test:integration

      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs server || true
          docker logs db || true

      - name: Clean up containers
        if: always()
        run: |
          docker rm -f server db 2>/dev/null || true
          docker network rm "$DOCKER_NETWORK" 2>/dev/null || true
